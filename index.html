<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Watchlist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <span class="navbar-brand">Movie Watchlist</span>
    </div>
  </nav>

  <main class="container my-4">

    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <p class="stat-label">Number of movies</p>
            <h3 id="movieCount">0</h3>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <p class="stat-label">Watched</p>
            <h3 id="watchedCount">0</h3>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <p class="stat-label">Average rating</p>
            <h3 id="averageRating">0</h3>
          </div>
        </div>
      </div>
    </div>
    
    <div class="card form-card mb-4">
      <div class="card-body">
        <h5 class="mb-3">Add movie</h5>

        <form id="movieForm" novalidate>
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" class="form-control" placeholder="e.g. Inception">
              <div class="error-msg" id="titleError"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="genre" class="form-label">Genre</label>
              <select id="genre" class="form-select">
                <option value="">Choose a genre</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Romance">Romance</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Animation">Animation</option>
                <option value="Other">Other</option>
              </select>
              <div class="error-msg" id="genreError"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="year" class="form-label">Year</label>
              <input type="number" id="year" class="form-control" placeholder="e.g. 2010">
              <div class="error-msg" id="yearError"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="rating" class="form-label">Rating</label>
              <select id="rating" class="form-select">
                <option value="">Choose a rating</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
              <div class="error-msg" id="ratingError"></div>
            </div>

          </div>

          <button type="submit" class="btn btn-main mt-3">Add movie</button>
        </form>
      </div>
    </div>

    <div class="row g-2 mb-3 align-items-center">
      <div class="col-12 col-md-3">
        <h5 class="mb-0">My movies</h5>
      </div>
      <div class="col-12 col-md-3">
        <input type="text" id="searchTitle" class="form-control" placeholder="Search by title...">
      </div>
      <div class="col-12 col-md-3">
        <select id="filterGenre" class="form-select">
          <option value="">All genres</option>
          <option value="Action">Action</option>
          <option value="Comedy">Comedy</option>
          <option value="Drama">Drama</option>
          <option value="Horror">Horror</option>
          <option value="Romance">Romance</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Animation">Animation</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <select id="sortBy" class="form-select">
          <option value="">Sort by...</option>
          <option value="rating-desc">Rating: High to Low</option>
          <option value="rating-asc">Rating: Low to High</option>
          <option value="year-desc">Year: Newest</option>
          <option value="year-asc">Year: Oldest</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <button id="randomBtn" class="btn btn-outline-danger w-100">🎲 What should I watch tonight?</button>
    </div>

    <div id="randomResult" class="mb-3"></div>

    <div class="row g-3" id="movieGrid"></div>

  </main>

  <script src="app.js"></script>
</body>
</html>
